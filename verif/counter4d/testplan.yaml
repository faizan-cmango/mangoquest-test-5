# testplan.yaml: counter4d (SAD 3.1) · Dayo · v1.0
block: counter4d
version: "1.0"
vps_ref: spec/counter4d/vps.yaml@v2
risk: LOW
targets: {line: 100, branch: 100, toggle: 100, fsm: 100, functional: 100}   # riskmap.yaml
formal_harness: none        # formal_properties_required is empty
coverage_dsl: v1
clock: clk                  # 100 MHz per clocks.yaml
harnesses: [verif/test_counter4d.py]
scenarios:
  - id: VPS-01
    revision: 1
    slug: reset
    req_ids: [REQ-3.1.1]
    intent: "Count up to a nonzero value with en 1, then drive rst_n to 0; also reset from zero at power-up."
    expected: "count is 0 after the next rising edge and while rst_n is 0."
    covergroup: cg_vps_01
    coverpoints: {count_at: [zero, mid]}
    directed: test_vps_01_reset
    properties: []
  - id: VPS-02
    revision: 1
    slug: hold
    req_ids: [REQ-3.1.4]
    intent: "Reach a nonzero count, drive en to 0 for several cycles."
    expected: "count stays unchanged while en is 0."
    covergroup: cg_vps_02
    coverpoints: {count_at: [mid]}
    directed: test_vps_02_hold
    properties: []
  - id: VPS-03
    revision: 1
    slug: increment
    req_ids: [REQ-3.1.2, REQ-3.1.6]
    intent: "After reset, drive en to 1 for several cycles."
    expected: "count rises by 1 at each rising edge and changes only then."
    covergroup: cg_vps_03
    coverpoints: {count_at: [zero, mid]}
    directed: test_vps_03_increment
    properties: []
  - id: VPS-04
    revision: 1
    slug: wrap
    req_ids: [REQ-3.1.3]
    intent: "Hold en at 1 from count 0 through 16 edges."
    expected: "count goes from 15 to 0."
    covergroup: cg_vps_04
    coverpoints: {count_at: [max, zero]}
    directed: test_vps_04_wrap
    properties: []
  - id: VPS-05
    revision: 1
    slug: reset_priority
    req_ids: [REQ-3.1.5]
    intent: "Drive rst_n 0 and en 1 together while count is nonzero."
    expected: "count becomes 0 and stays 0 while rst_n is 0."
    covergroup: cg_vps_05
    coverpoints: {count_at: [mid]}
    directed: test_vps_05_reset_priority
    properties: []
extra_tests: [test_random_seeded]
constraint_model:
  IDD-COUNT_IF:
    en: "0 or 1 at every falling edge, 1 about 2 edges in 3; driven only at falling clk edges (R1)"
    rst_n: "0 at about 1 falling edge in 12, also with en 1 (R2); driven only at falling clk edges (R1)"
  illegal_inputs_excluded: ["any input change in the timestep of a rising clk edge (R1 of IDD-COUNT_IF)"]
