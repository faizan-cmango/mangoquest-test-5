vps: spec/counter4d/vps.yaml@v0.1
block: counter4d
scenarios:
  - id: VPS-01
    slug: reset
    req_ids: [REQ-3.1.1]
    observe: [IDD-COUNT_IF.count]
    intent: "Count up to a nonzero value with en 1, then drive rst_n to 0."
    expected: "count is 0 after the next rising edge and while rst_n is 0."
    checks: ["count == 0 within 1 cycles after fall(rst_n)", "count == 0 while reset"]
    distinguishes: {count_at: [zero, mid]}
    formal: false
  - id: VPS-02
    slug: hold
    req_ids: [REQ-3.1.4]
    observe: [IDD-COUNT_IF.count]
    intent: "Reach a nonzero count, drive en to 0 for several cycles."
    expected: "count stays unchanged while en is 0."
    checks: ["count != 0 while low(en)"]
    distinguishes: {count_at: [mid]}
    formal: false
  - id: VPS-03
    slug: increment
    req_ids: [REQ-3.1.2, REQ-3.1.6]
    observe: [IDD-COUNT_IF.count]
    intent: "After reset, drive en to 1 for several cycles."
    expected: "count rises by 1 at each rising edge and changes only then."
    checks: ["count == 1 within 1 cycles after rise(en)"]
    distinguishes: {count_at: [zero, mid]}
    formal: false
  - id: VPS-04
    slug: wrap
    req_ids: [REQ-3.1.3]
    observe: [IDD-COUNT_IF.count]
    intent: "Hold en at 1 from count 0 through 16 edges."
    expected: "count goes from 15 to 0."
    checks: ["count == 0 within 16 cycles after rise(en)"]
    distinguishes: {count_at: [max, zero]}
    formal: false
  - id: VPS-05
    slug: reset_priority
    req_ids: [REQ-3.1.5]
    observe: [IDD-COUNT_IF.count]
    intent: "Drive rst_n 0 and en 1 together while count is nonzero."
    expected: "count becomes 0 and stays 0 while rst_n is 0."
    checks: ["count == 0 while reset", "count == 0 within 1 cycles after fall(rst_n)"]
    distinguishes: {count_at: [mid]}
    formal: false
environment:
  clk: "100 MHz, starts low, first rising edge half a period after inputs are first driven"
  en: "any value, driven only at falling clk edges"
  rst_n: "any value, driven only at falling clk edges"
  illegal_inputs: ["any input change in the timestep of a rising clk edge"]
retired: {}
